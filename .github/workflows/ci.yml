name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and project checks
        run: |
          npm run check
          node --check scripts/test-java.mjs
      - name: Backend and browser tests
        run: npm test

  android:
    name: Java domain tests and Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Pure Java and API contract tests
        # Downloads test-only org.json with a SHA-256 pin; never calls provider APIs.
        run: node scripts/test-java.mjs --download-json
      - name: Build APK with the published Pleos SDK
        working-directory: android
        run: sh gradlew assembleDebug --no-daemon --console=plain
